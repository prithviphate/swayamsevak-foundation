{% if messages %}
<div class="container my-3" aria-live="polite">
  {% for message in messages %}
  <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show d-flex align-items-center shadow-sm" role="alert">
    <div class="me-2">
      {% if message.tags == 'success' %}
        <i class="bi bi-check-circle-fill fs-5 text-success"></i>
      {% elif message.tags == 'danger' or message.tags == 'error' %}
        <i class="bi bi-exclamation-triangle-fill fs-5 text-danger"></i>
      {% elif message.tags == 'warning' %}
        <i class="bi bi-exclamation-circle-fill fs-5 text-warning"></i>
      {% else %}
        <i class="bi bi-info-circle-fill fs-5 text-info"></i>
      {% endif %}
    </div>
    <div class="flex-grow-1">
      {{ message }}
    </div>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  {% endfor %}
</div>
{% endif %}
